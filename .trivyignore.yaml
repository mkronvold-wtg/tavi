misconfigurations:
  # Bitnami Secure PostgreSQL image requires UID/GID 1001; cannot raise above 10000.
  - id: KSV-0020
    paths:
      - infra/k8s/k8s-with-internal-db/postgres-statefulset.yaml
    statement: "Owner: platform. Bitnami BSI PostgreSQL runs as UID 1001 by design."
    expired_at: 2027-02-28
  - id: KSV-0021
    paths:
      - infra/k8s/k8s-with-internal-db/postgres-statefulset.yaml
    statement: "Owner: platform. Bitnami BSI PostgreSQL runs as GID 1001 by design."
    expired_at: 2027-02-28
  # CloudNativePG PostgreSQL images use UID/GID 26.
  - id: KSV-0020
    paths:
      - infra/k8s/k8s-with-replicas-and-internal-ha-db/postgres-cluster.yaml
    statement: "Owner: platform. CNPG PostgreSQL images require UID 26."
    expired_at: 2027-02-28
