# Approved Trivy exceptions. Every entry includes an owner in its statement and
# an expiration date. Dependabot tracks the pinned base-image digest; remove
# these entries as soon as an upstream fixed package is available.
vulnerabilities:
  - id: CVE-2026-39113
    statement: "Owner: platform. libsqlite3-0 3.46.1-7+deb13u1 is inherited from node:26-trixie-slim in API, web, and worker. Trivy reports no fixed version. Safe removal is blocked because essential util-linux pre-depends on liblastlog2-2, which depends on libsqlite3-0. Review the Debian package and base-image digest; remove when a fixed package is available."
