name: One-time self-hosted registry connectivity

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect-bsi-node:
    runs-on: [self-hosted, docker-wtg]
    timeout-minutes: 25
    steps:
      - name: Discover BSI Node candidates
        env:
          REGISTRY_USER: ${{ secrets.ARTIFACTORY_USERNAME }}
          REGISTRY_TOKEN: ${{ secrets.ARTIFACTORY_RO_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          work="$(mktemp -d)"
          trap 'rm -rf "$work"' EXIT
          auth="$work/auth"
          printf 'user = "%s:%s"\n' "$REGISTRY_USER" "$REGISTRY_TOKEN" > "$auth"
          chmod 600 "$auth"
          found=false
          for distro in debian-12 debian-13; do
            for product in node nodejs; do
              path="bitnami-docker-secure/containers/$distro/$product"
              code="$(curl --silent --show-error --config "$auth" --output "$work/tags.json" --write-out '%{http_code}' "https://sv4.art.e2open.com/v2/$path/tags/list")"
              echo "$path: HTTP $code"
              if [[ "$code" == 404 ]]; then continue; fi
              if [[ "$code" != 200 ]]; then
                echo "::error::Registry discovery failed with HTTP $code"
                exit 1
              fi
              jq -r '.tags[]?' "$work/tags.json" | grep -E '^26([.-]|$)' > "$work/candidates" || test "$?" = 1
              cat "$work/candidates"
              tag="$(sort -V "$work/candidates" | tail -n 1)"
              if [[ -n "$tag" ]]; then
                found=true
                image="sv4.art.e2open.com/$path:$tag"
                echo "Scanning candidate $image"
                export DOCKER_CONFIG="$work/docker"
                mkdir -p "$DOCKER_CONFIG"
                printf '%s' "$REGISTRY_TOKEN" | docker login sv4.art.e2open.com --username "$REGISTRY_USER" --password-stdin
                docker pull "$image"
                ref="$(docker image inspect --format '{{index .RepoDigests 0}}' "$image")"
                docker image inspect --format 'Digest={{json .RepoDigests}} Labels={{json .Config.Labels}}' "$image"
                echo "Pinned candidate: $ref"
                docker run --rm --entrypoint /bin/sh "$ref" -c 'cat /etc/os-release; node --version; dpkg-query -W util-linux libsystemd0 libudev1 2>/dev/null || test "$?" = 1'
                docker run --rm \
                  -v "$DOCKER_CONFIG:/root/.docker:ro" \
                  aquasec/trivy:0.69.3 image \
                  --scanners vuln --severity HIGH,CRITICAL \
                  --ignore-unfixed=false --exit-code 0 "$ref"
              fi
            done
          done
          if [[ "$found" != true ]]; then
            echo "::error::No Node 26 tags found in the four queried BSI Debian repositories"
            exit 1
          fi
