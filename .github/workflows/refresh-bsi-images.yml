name: Refresh BSI images

# Internal / BSI lane only (Artifactory + docker-wtg + tavi-dev).
# Public lane (GHCR, Docker Hub, compose, github-hosted / dockerhost-home) is unchanged.

on:
  schedule:
    # Pick up Broadcom/BSI refreshes published into sv4.art.
    - cron: "23 7 * * 1"
  workflow_dispatch:
    inputs:
      deploy_tavi_dev:
        description: Deploy refreshed BSI postgres pin to tavi-dev after updating the pin
        type: boolean
        default: true
      open_pr_if_changed:
        description: Open a PR when the candidate digest moves (instead of failing closed)
        type: boolean
        default: true
  push:
    branches:
      - main
    paths:
      - "infra/images/bsi-*.pin.json"
      - "infra/k8s/k8s-with-internal-db/postgres-statefulset.yaml"
      - "scripts/sync-bsi-pins.mjs"
      - "scripts/sync-bsi-pins.sh"
      - ".github/workflows/refresh-bsi-images.yml"
  pull_request:
    paths:
      - "infra/images/bsi-*.pin.json"
      - "infra/k8s/k8s-with-internal-db/postgres-statefulset.yaml"
      - "scripts/sync-bsi-pins.mjs"
      - "scripts/sync-bsi-pins.sh"
      - ".github/workflows/refresh-bsi-images.yml"

concurrency:
  group: refresh-bsi-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  pull-requests: read

jobs:
  sync-check:
    name: Sync BSI pins into Kubernetes manifests
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Rewrite consumers from BSI pin files
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v jq >/dev/null 2>&1; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq jq
          fi
          chmod +x scripts/sync-bsi-pins.sh
          ./scripts/sync-bsi-pins.sh

      - name: Ensure pin sync is committed
        run: |
          if ! git diff --exit-code -- infra/k8s; then
            echo "::error::Kubernetes BSI pins are out of sync. Run: ./scripts/sync-bsi-pins.sh"
            git --no-pager diff -- infra/k8s
            exit 1
          fi

  resolve-latest:
    name: Resolve latest BSI postgresql candidate
    if: >-
      github.event_name == 'schedule' ||
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'push' && github.ref == 'refs/heads/main')
    needs: sync-check
    runs-on:
      - self-hosted
      - docker-wtg
    outputs:
      digest: ${{ steps.resolve.outputs.digest }}
      app_version: ${{ steps.resolve.outputs.app_version }}
      changed: ${{ steps.resolve.outputs.changed }}
      pull_ref: ${{ steps.resolve.outputs.pull_ref }}
      source_ref: ${{ steps.resolve.outputs.source_ref }}
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          # Need a token that can push a branch / open a PR on schedule.
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to Artifactory (read candidate)
        uses: docker/login-action@v4
        with:
          registry: sv4.art.e2open.com
          username: ${{ secrets.ARTIFACTORY_USERNAME }}
          # RO is enough to pull BSI; fall back to RW if only one token is set.
          password: ${{ secrets.ARTIFACTORY_RO_TOKEN }}

      - name: Resolve latest digest from sv4.art
        id: resolve
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v jq >/dev/null 2>&1; then
            echo "::error::jq is required on docker-wtg for BSI pin resolve"
            exit 127
          fi
          PIN_FILE=infra/images/bsi-postgresql.pin.json
          source_image="$(jq -r '.source_image' "${PIN_FILE}")"
          pull_image="$(jq -r '.pull_image' "${PIN_FILE}")"
          tag="$(jq -r '.candidate_tag // "latest"' "${PIN_FILE}")"
          current="$(jq -r '.digest' "${PIN_FILE}")"

          source_ref="${source_image}:${tag}"
          echo "Pulling candidate ${source_ref}"
          docker pull "${source_ref}"

          digest="$(docker image inspect --format '{{index .RepoDigests 0}}' "${source_ref}")"
          digest="${digest##*@}"
          if [[ ! "${digest}" =~ ^sha256:[a-f0-9]{64}$ ]]; then
            # Some engines only populate Id; resolve via repo digest list.
            digest="$(docker image inspect --format '{{range .RepoDigests}}{{println .}}{{end}}' "${source_ref}" | awk -F@ 'NF==2 {print $2; exit}')"
          fi
          if [[ ! "${digest}" =~ ^sha256:[a-f0-9]{64}$ ]]; then
            echo "::error::Could not resolve digest for ${source_ref}"
            exit 1
          fi

          app_version="$(docker image inspect --format '{{index .Config.Env}}' "${source_ref}" | tr ' ' '\n' | sed -n 's/^APP_VERSION=//p' | head -n1 || true)"
          if [[ -z "${app_version}" ]]; then
            app_version="$(docker image inspect --format '{{index .Config.Labels "org.opencontainers.image.version"}}' "${source_ref}" || true)"
          fi

          pull_ref="${pull_image}@${digest}"
          source_digest_ref="${source_image}@${digest}"
          changed=false
          if [[ "${digest}" != "${current}" ]]; then
            changed=true
          fi

          {
            echo "digest=${digest}"
            echo "app_version=${app_version}"
            echo "changed=${changed}"
            echo "pull_ref=${pull_ref}"
            echo "source_ref=${source_digest_ref}"
          } >> "$GITHUB_OUTPUT"

          echo "current=${current}"
          echo "latest=${digest}"
          echo "changed=${changed}"
          echo "app_version=${app_version}"

      - name: Update pin file when candidate moves
        if: steps.resolve.outputs.changed == 'true'
        shell: bash
        env:
          DIGEST: ${{ steps.resolve.outputs.digest }}
          APP_VERSION: ${{ steps.resolve.outputs.app_version }}
        run: |
          set -euo pipefail
          PIN_FILE=infra/images/bsi-postgresql.pin.json
          tmp="$(mktemp)"
          if [[ -n "${APP_VERSION}" ]]; then
            jq --arg d "${DIGEST}" --arg v "${APP_VERSION}" \
              '.digest = $d | .app_version = $v' "${PIN_FILE}" > "${tmp}"
          else
            jq --arg d "${DIGEST}" '.digest = $d' "${PIN_FILE}" > "${tmp}"
          fi
          mv "${tmp}" "${PIN_FILE}"
          chmod +x scripts/sync-bsi-pins.sh
          ./scripts/sync-bsi-pins.sh
          git --no-pager diff -- infra/images infra/k8s || true

      - name: Open PR for BSI candidate bump
        if: >-
          steps.resolve.outputs.changed == 'true' &&
          (github.event_name == 'schedule' ||
            (github.event_name == 'workflow_dispatch' && inputs.open_pr_if_changed))
        uses: peter-evans/create-pull-request@v8
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          branch: chore/bsi-postgresql-candidate
          delete-branch: true
          title: "chore(bsi): refresh postgresql candidate ${{ steps.resolve.outputs.app_version }}"
          commit-message: |
            chore(bsi): refresh postgresql candidate

            Digest: ${{ steps.resolve.outputs.digest }}
            Version: ${{ steps.resolve.outputs.app_version }}
          body: |
            ## Summary
            - Resolved `latest` from `sv4.art.e2open.com/bitnami-docker-secure/containers/debian-12/postgresql`
            - Pin digest: `${{ steps.resolve.outputs.digest }}`
            - App version: `${{ steps.resolve.outputs.app_version }}`
            - Kubernetes consumer rewritten to `repo.ops` pull ref

            ## Notes
            Internal/BSI lane only. Public compose/GHCR images are unchanged.
            After merge, `Refresh BSI images` deploys the pin to tavi-dev.
          add-paths: |
            infra/images/bsi-postgresql.pin.json
            infra/k8s/k8s-with-internal-db/postgres-statefulset.yaml

  deploy-tavi-dev:
    name: Deploy BSI postgres candidate to tavi-dev
    if: >-
      always() &&
      needs.sync-check.result == 'success' &&
      (
        (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
        (github.event_name == 'workflow_dispatch' && inputs.deploy_tavi_dev)
      )
    needs:
      - sync-check
      - resolve-latest
    runs-on:
      - self-hosted
      - docker-wtg
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Resolve deploy pin
        id: pin
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v jq >/dev/null 2>&1; then
            echo "::error::jq is required on docker-wtg for BSI pin deploy"
            exit 127
          fi
          PIN_FILE=infra/images/bsi-postgresql.pin.json
          STS_FILE=infra/k8s/k8s-with-internal-db/postgres-statefulset.yaml
          pull_image="$(jq -r '.pull_image' "${PIN_FILE}")"
          digest="$(jq -r '.digest' "${PIN_FILE}")"
          pull_ref="${pull_image}@${digest}"
          if ! grep -Fq "${pull_ref}" "${STS_FILE}"; then
            echo "::error::StatefulSet does not contain pin ${pull_ref}; run ./scripts/sync-bsi-pins.sh"
            exit 1
          fi
          echo "pull_ref=${pull_ref}" >> "$GITHUB_OUTPUT"
          echo "digest=${digest}" >> "$GITHUB_OUTPUT"
          echo "Deploying postgres pin only (app image tags unchanged): ${pull_ref}"

      - name: Deploy postgres pin only via jump-host
        env:
          SSH_KEY: ${{ secrets.TAVI_DEV_SSH_KEY }}
          SSH_HOST: ${{ secrets.TAVI_DEV_SSH_HOST }}
          SSH_USER: ${{ secrets.TAVI_DEV_SSH_USER }}
          VKS_PASSCODE: ${{ secrets.VKS_PASSCODE }}
          TAVI_DEV_DIR: ${{ vars.TAVI_DEV_DIR }}
          PULL_REF: ${{ steps.pin.outputs.pull_ref }}
        shell: bash
        run: |
          set -euo pipefail
          : "${SSH_KEY:?Set repository secret TAVI_DEV_SSH_KEY}"
          : "${SSH_HOST:?Set repository secret TAVI_DEV_SSH_HOST}"
          : "${SSH_USER:?Set repository secret TAVI_DEV_SSH_USER}"
          : "${VKS_PASSCODE:?Set repository secret VKS_PASSCODE}"
          : "${PULL_REF:?missing pin pull_ref}"

          # BSI refresh must not call update.sh with github.sha — that rewrites
          # api/web/worker tags and races Publish. Apply only postgres STS.
          namespace="${K8S_NAMESPACE:-tavi-dev}"
          cluster="${K8S_CLUSTER:-sv4d-cops-nonp}"
          dev_dir="${TAVI_DEV_DIR:-/e2open/home/mkronvold/src/tavi-dev}"
          sts_src="infra/k8s/k8s-with-internal-db/postgres-statefulset.yaml"

          key_file="$(mktemp)"
          sts_prepared="$(mktemp)"
          remote_script="$(mktemp)"
          cleanup() { rm -f "${key_file}" "${sts_prepared}" "${remote_script}"; }
          trap cleanup EXIT

          sed -E "s/^([[:space:]]*namespace:[[:space:]]*).+$/\1${namespace}/" \
            "${sts_src}" > "${sts_prepared}"
          if ! grep -Fq "${PULL_REF}" "${sts_prepared}"; then
            echo "::error::Prepared STS missing pin ${PULL_REF}"
            exit 1
          fi

          printf '%s\n' "${SSH_KEY}" > "${key_file}"
          chmod 600 "${key_file}"

          cat > "${remote_script}" <<'EOS'
          set -euo pipefail
          namespace="$1"
          cluster="$2"
          dev_dir="$3"
          pull_ref="$4"
          sts_b64="$5"

          export PASSCODE="${PASSCODE:-}"
          if command -v k8s-login >/dev/null 2>&1; then
            k8s-login --unattended --cluster "${cluster}" \
              || k8s-login --unattended -c "${cluster}" \
              || k8s-login -c "${cluster}"
          fi
          kubectl config set-context --current --namespace="${namespace}" >/dev/null

          before_api="$(kubectl -n "${namespace}" get deploy tavi-api -o jsonpath='{.spec.template.spec.containers[0].image}' 2>/dev/null || true)"
          before_web="$(kubectl -n "${namespace}" get deploy tavi-web -o jsonpath='{.spec.template.spec.containers[0].image}' 2>/dev/null || true)"
          before_worker="$(kubectl -n "${namespace}" get deploy tavi-worker -o jsonpath='{.spec.template.spec.containers[0].image}' 2>/dev/null || true)"
          echo "app_images_before api=${before_api} web=${before_web} worker=${before_worker}"

          mkdir -p "${dev_dir}"
          printf '%s' "${sts_b64}" | base64 -d > "${dev_dir}/postgres-statefulset.yaml"
          echo "Wrote ${dev_dir}/postgres-statefulset.yaml"
          if ! grep -Fq "${pull_ref}" "${dev_dir}/postgres-statefulset.yaml"; then
            echo "Jump-host STS missing expected pin ${pull_ref}" >&2
            exit 1
          fi

          kubectl apply -f "${dev_dir}/postgres-statefulset.yaml"
          kubectl rollout status "statefulset/tavi-postgres" -n "${namespace}" --timeout=5m

          after_api="$(kubectl -n "${namespace}" get deploy tavi-api -o jsonpath='{.spec.template.spec.containers[0].image}' 2>/dev/null || true)"
          after_web="$(kubectl -n "${namespace}" get deploy tavi-web -o jsonpath='{.spec.template.spec.containers[0].image}' 2>/dev/null || true)"
          after_worker="$(kubectl -n "${namespace}" get deploy tavi-worker -o jsonpath='{.spec.template.spec.containers[0].image}' 2>/dev/null || true)"
          echo "app_images_after api=${after_api} web=${after_web} worker=${after_worker}"

          if [[ "${before_api}" != "${after_api}" || "${before_web}" != "${after_web}" || "${before_worker}" != "${after_worker}" ]]; then
            echo "App image tags changed during BSI postgres-only deploy" >&2
            exit 1
          fi

          live_pg="$(kubectl -n "${namespace}" get sts tavi-postgres -o jsonpath='{.spec.template.spec.containers[0].image}')"
          echo "postgres_image=${live_pg}"
          if [[ "${live_pg}" != "${pull_ref}" ]]; then
            echo "Live postgres image ${live_pg} does not match pin ${pull_ref}" >&2
            exit 1
          fi
          EOS

          # Drop YAML-indent spaces that leaked into the remote script body.
          sed -i 's/^          //' "${remote_script}"

          sts_b64="$(base64 -w0 "${sts_prepared}" 2>/dev/null || base64 "${sts_prepared}" | tr -d '\n')"

          ssh -i "${key_file}" \
            -o BatchMode=yes \
            -o StrictHostKeyChecking=accept-new \
            "${SSH_USER}@${SSH_HOST}" \
            "export PASSCODE=$(printf '%q' "${VKS_PASSCODE}"); bash -s -- $(printf '%q' "${namespace}") $(printf '%q' "${cluster}") $(printf '%q' "${dev_dir}") $(printf '%q' "${PULL_REF}") $(printf '%q' "${sts_b64}")" \
            < "${remote_script}"
