name: One-time registry connectivity

on:
  push:
    branches:
      - mkronvold-wtg-migrating-tavi-repository
    paths:
      - .github/workflows/one-time-registry-connectivity.yml

permissions: {}

jobs:
  check-repo-ops:
    name: Check repo.ops reachability
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Resolve registry hostname
        run: getent ahostsv4 repo.ops.e2open.com

      - name: Check registry endpoint
        shell: bash
        run: |
          set -euo pipefail
          status="$(
            curl \
              --silent \
              --show-error \
              --output /dev/null \
              --write-out '%{http_code}' \
              --connect-timeout 10 \
              --max-time 20 \
              https://repo.ops.e2open.com/v2/
          )"

          if [[ "$status" != "200" && "$status" != "401" ]]; then
            echo "Unexpected registry response: HTTP $status" >&2
            exit 1
          fi

          echo "Registry endpoint reached: HTTP $status"
