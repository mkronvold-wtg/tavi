name: Scan container images

on:
  # This workflow's job names are required by main branch protection.
  pull_request:
  push:
    branches:
      - main
    paths:
      - ".dockerignore"
      - ".trivyignore.yaml"
      - ".github/workflows/publish-images.yml"
      - ".github/workflows/refresh-images.yml"
      - ".github/workflows/trivy-scan.yml"
      - "apps/**"
      - "packages/**"
      - "infra/docker/**"
      - "package.json"
      - ".node-version"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "turbo.json"
      - "tsconfig.base.json"
  workflow_run:
    workflows:
      - Refresh container images
    types:
      - completed
  workflow_dispatch:

concurrency:
  group: trivy-scan-${{ github.event.pull_request.number || github.ref || github.event.workflow_run.id }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: read
  security-events: write

jobs:
  changes:
    name: Detect container-relevant changes
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      container_inputs: ${{ steps.filter.outputs.container_inputs }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Detect container-relevant changes
        id: filter
        uses: dorny/paths-filter@v4
        with:
          filters: |
            container_inputs:
              - ".dockerignore"
              - ".trivyignore.yaml"
              - ".github/dependabot.yml"
              - ".github/workflows/automerge-dependencies.yml"
              - ".github/workflows/publish-images.yml"
              - ".github/workflows/refresh-images.yml"
              - ".github/workflows/trivy-scan.yml"
              - "apps/**"
              - "packages/**"
              - "infra/docker/**"
              - "scripts/update-release-pins.mjs"
              - "package.json"
              - ".node-version"
              - "pnpm-lock.yaml"
              - "pnpm-workspace.yaml"
              - "turbo.json"
              - "tsconfig.base.json"

  scan-local-images:
    name: Scan ${{ matrix.service }} image
    needs: changes
    if: >-
      always() &&
      github.event_name != 'workflow_run' &&
      (
        github.event_name != 'pull_request' ||
        needs.changes.result != 'success' ||
        needs.changes.outputs.container_inputs == 'true'
      )
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: api
            dockerfile: infra/docker/api.Dockerfile
          - service: web
            dockerfile: infra/docker/web.Dockerfile
          - service: worker
            dockerfile: infra/docker/worker.Dockerfile
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Build image
        run: |
          docker build \
            --file "${{ matrix.dockerfile }}" \
            --tag "tavi-${{ matrix.service }}:${{ github.sha }}" \
            .

      - name: Report image vulnerabilities
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: tavi-${{ matrix.service }}:${{ github.sha }}
          format: sarif
          output: trivy-${{ matrix.service }}.sarif
          severity: UNKNOWN,LOW,MEDIUM,HIGH,CRITICAL
          limit-severities-for-sarif: "true"
          scanners: vuln
          trivyignores: .trivyignore.yaml
          exit-code: "0"

      - name: Upload scan results
        if: always() && hashFiles(format('trivy-{0}.sarif', matrix.service)) != ''
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: trivy-${{ matrix.service }}.sarif
          category: trivy-${{ matrix.service }}

      - name: Enforce high and critical vulnerabilities
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: tavi-${{ matrix.service }}:${{ github.sha }}
          format: table
          severity: HIGH,CRITICAL
          scanners: vuln
          trivyignores: .trivyignore.yaml
          exit-code: "1"

  scan-filesystem:
    name: Scan repository configuration
    if: github.event_name != 'workflow_run'
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Report filesystem misconfigurations and secrets
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          format: sarif
          output: trivy-filesystem.sarif
          severity: UNKNOWN,LOW,MEDIUM,HIGH,CRITICAL
          limit-severities-for-sarif: "true"
          scanners: misconfig,secret
          trivyignores: .trivyignore.yaml
          exit-code: "0"

      - name: Upload filesystem scan results
        if: always() && hashFiles('trivy-filesystem.sarif') != ''
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: trivy-filesystem.sarif
          category: trivy-filesystem

  scan-refreshed-images:
    name: Scan refreshed ${{ matrix.service }} image
    if: >-
      github.event_name == 'workflow_run' &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_branch == github.event.repository.default_branch
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: api
            image: tavi-api
          - service: web
            image: tavi-web
          - service: worker
            image: tavi-worker
    steps:
      - name: Check out refresh policy
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Report refreshed image vulnerabilities
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ghcr.io/${{ github.repository_owner }}/tavi-${{ matrix.service }}:latest
          format: sarif
          output: trivy-${{ matrix.service }}.sarif
          severity: UNKNOWN,LOW,MEDIUM,HIGH,CRITICAL
          limit-severities-for-sarif: "true"
          scanners: vuln
          trivyignores: .trivyignore.yaml
          exit-code: "0"

      - name: Upload scan results
        if: always() && hashFiles(format('trivy-{0}.sarif', matrix.service)) != ''
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: trivy-${{ matrix.service }}.sarif
          category: trivy-${{ matrix.service }}

      - name: Enforce high and critical vulnerabilities
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ghcr.io/${{ github.repository_owner }}/tavi-${{ matrix.service }}:latest
          format: table
          severity: HIGH,CRITICAL
          scanners: vuln
          trivyignores: .trivyignore.yaml
          exit-code: "1"
