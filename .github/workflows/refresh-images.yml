name: Refresh container images

on:
  schedule:
    - cron: "17 8 * * 1"
  workflow_dispatch:

concurrency:
  group: refresh-images-${{ github.ref }}
  cancel-in-progress: false

permissions:
  attestations: write
  contents: read
  id-token: write
  packages: write

jobs:
  prepare:
    name: Prepare refresh tag
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    outputs:
      refresh_tag: ${{ steps.tag.outputs.refresh_tag }}
    steps:
      - name: Create refresh tag
        id: tag
        run: echo "refresh_tag=refresh-$(date -u +'%Y%m%d-%H%M%S')" >> "$GITHUB_OUTPUT"

  validate:
    name: Validate workspace
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version-file: .node-version

      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies
        run: corepack pnpm install --frozen-lockfile

      - name: Prepare generated artifacts
        run: |
          corepack pnpm --filter @tavi/config build
          corepack pnpm --filter @tavi/schemas build
          corepack pnpm --filter @tavi/api prisma:generate

      - name: Lint
        run: corepack pnpm lint

      - name: Typecheck
        run: corepack pnpm typecheck

      - name: Test
        run: corepack pnpm test

  refresh:
    name: Refresh ${{ matrix.service }} image
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    needs:
      - prepare
      - validate
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: api
            image: tavi-api
            dockerfile: infra/docker/api.Dockerfile
          - service: web
            image: tavi-web
            dockerfile: infra/docker/web.Dockerfile
          - service: worker
            image: tavi-worker
            dockerfile: infra/docker/worker.Dockerfile

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Normalize GHCR owner
        id: vars
        run: echo "owner=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"

      - name: Set build metadata
        id: build-metadata
        run: echo "date=$(date -u +'%Y-%m-%dT%H:%M:%SZ')" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate image metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ steps.vars.outputs.owner }}/${{ matrix.image }}
          tags: |
            type=raw,value=latest
            type=raw,value=${{ needs.prepare.outputs.refresh_tag }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.title=${{ matrix.image }}

      - name: Build and publish refreshed image
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          pull: true
          no-cache: true
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            TAVI_BUILD_SHA=${{ github.sha }}
            TAVI_BUILD_DATE=${{ steps.build-metadata.outputs.date }}
          provenance: mode=max
          sbom: true

      - name: Generate CycloneDX SBOM
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ghcr.io/${{ steps.vars.outputs.owner }}/${{ matrix.image }}@${{ steps.build.outputs.digest }}
          format: cyclonedx
          output: ${{ matrix.service }}.cdx.json
          exit-code: "0"

      - name: Upload CycloneDX SBOM
        uses: actions/upload-artifact@v7
        with:
          name: refresh-${{ matrix.service }}-cyclonedx
          path: ${{ matrix.service }}.cdx.json
          retention-days: 180

      - name: Scan published image with Trivy
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ghcr.io/${{ steps.vars.outputs.owner }}/${{ matrix.image }}@${{ steps.build.outputs.digest }}
          format: table
          output: ${{ matrix.service }}-trivy.txt
          severity: HIGH,CRITICAL
          scanners: vuln
          trivyignores: .trivyignore.yaml
          exit-code: "0"

      - name: Upload published image scan report
        uses: actions/upload-artifact@v7
        with:
          name: refresh-${{ matrix.service }}-trivy-report
          path: ${{ matrix.service }}-trivy.txt
          retention-days: 180

  refresh-internal:
    name: Refresh internal ${{ matrix.service }} image
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    needs:
      - prepare
      - validate
    runs-on:
      - self-hosted
      - docker-wtg
    permissions:
      contents: read
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        include:
          - service: api
            image: tavi-api
            dockerfile: infra/docker/api.Dockerfile
          - service: web
            image: tavi-web
            dockerfile: infra/docker/web.Dockerfile
          - service: worker
            image: tavi-worker
            dockerfile: infra/docker/worker.Dockerfile

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Log in to Artifactory
        uses: docker/login-action@v4
        with:
          registry: sv4.art.e2open.com
          username: ${{ secrets.ARTIFACTORY_USERNAME }}
          password: ${{ secrets.ARTIFACTORY_TOKEN }}

      - name: Set build metadata
        id: build-metadata
        run: echo "date=$(date -u +'%Y-%m-%dT%H:%M:%SZ')" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Generate image metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: sv4.art.e2open.com/dcops-docker-repo/${{ matrix.image }}
          tags: |
            type=raw,value=latest
            type=raw,value=${{ needs.prepare.outputs.refresh_tag }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.title=${{ matrix.image }}

      - name: Build and publish refreshed internal image
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          pull: true
          no-cache: true
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            TAVI_BUILD_SHA=${{ github.sha }}
            TAVI_BUILD_DATE=${{ steps.build-metadata.outputs.date }}
          provenance: mode=max
          sbom: true

      - name: Save internal image digest
        run: printf '%s\n' '${{ steps.build.outputs.digest }}' > internal-refresh-${{ matrix.service }}.digest

      - name: Upload internal image digest
        uses: actions/upload-artifact@v7
        with:
          name: internal-refresh-image-digest-${{ matrix.service }}
          path: internal-refresh-${{ matrix.service }}.digest
          retention-days: 180
