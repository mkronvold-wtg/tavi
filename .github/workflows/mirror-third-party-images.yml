name: Mirror third-party images

on:
  push:
    branches:
      - main
    paths:
      - "infra/images/**"
      - "infra/k8s/k8s-with-internal-db/postgres-statefulset.yaml"
      - "scripts/sync-third-party-pins.mjs"
      - ".github/workflows/mirror-third-party-images.yml"
  pull_request:
    paths:
      - "infra/images/**"
      - "infra/k8s/k8s-with-internal-db/postgres-statefulset.yaml"
      - "scripts/sync-third-party-pins.mjs"
      - ".github/workflows/mirror-third-party-images.yml"
  schedule:
    # Catch upstream tag moves even if Dependabot is quiet.
    - cron: "23 7 * * 1"
  workflow_dispatch:

concurrency:
  group: mirror-third-party-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  sync-pins:
    name: Sync Kubernetes pins from image Dockerfiles
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version-file: .node-version

      - name: Rewrite consumer manifests from infra/images pins
        run: node scripts/sync-third-party-pins.mjs

      - name: Ensure pin sync is committed
        run: |
          if ! git diff --exit-code -- infra/k8s; then
            echo "::error::Kubernetes third-party pins are out of sync with infra/images. Run: node scripts/sync-third-party-pins.mjs"
            git --no-pager diff -- infra/k8s
            exit 1
          fi

  mirror:
    name: Mirror ${{ matrix.image }} to Artifactory
    # Trusted publish only: default branch / schedule / manual. PRs only sync-check.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event_name == 'schedule' ||
      (github.event_name == 'push' && github.ref == 'refs/heads/main')
    needs: sync-pins
    runs-on:
      - self-hosted
      - docker-wtg
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        include:
          - image: postgres
            dockerfile: infra/images/postgres.Dockerfile

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Log in to Artifactory
        uses: docker/login-action@v4
        with:
          registry: sv4.art.e2open.com
          username: ${{ secrets.ARTIFACTORY_USERNAME }}
          password: ${{ secrets.ARTIFACTORY_RW_TOKEN }}

      - name: Parse source pin
        id: pin
        shell: bash
        run: |
          set -euo pipefail
          from_line="$(grep -E '^\s*FROM\s+' "${{ matrix.dockerfile }}" | tail -n1)"
          ref="$(awk '{print $2}' <<<"${from_line}")"
          if [[ ! "${ref}" =~ @sha256:[a-f0-9]{64}$ ]]; then
            echo "::error::${{ matrix.dockerfile }} FROM must include @sha256 digest"
            exit 1
          fi
          source_no_digest="${ref%@*}"
          digest="${ref##*@}"
          tag="${source_no_digest##*:}"
          if [[ -z "${tag}" || "${tag}" == "${source_no_digest}" ]]; then
            echo "::error::Could not parse tag from ${ref}"
            exit 1
          fi
          target_base="sv4.art.e2open.com/dcops-docker-repo/${{ matrix.image }}"
          {
            echo "source=${ref}"
            echo "tag=${tag}"
            echo "digest=${digest}"
            echo "target_tag=${target_base}:${tag}"
            echo "target_digest=${target_base}@${digest}"
          } >> "$GITHUB_OUTPUT"
          echo "Mirroring ${ref}"
          echo "  -> ${target_base}:${tag}"
          echo "  -> ${target_base}@${digest}"

      - name: Pull source image
        run: docker pull "${{ steps.pin.outputs.source }}"

      - name: Tag for Artifactory
        run: |
          docker tag "${{ steps.pin.outputs.source }}" "${{ steps.pin.outputs.target_tag }}"

      - name: Push tag to Artifactory
        run: docker push "${{ steps.pin.outputs.target_tag }}"

      - name: Verify pushed digest matches pin
        shell: bash
        run: |
          set -euo pipefail
          # Prefer digest from local image after push; fall back to inspect by tag.
          pushed="$(docker image inspect --format '{{index .RepoDigests 0}}' "${{ steps.pin.outputs.target_tag }}" 2>/dev/null || true)"
          if [[ -z "${pushed}" ]]; then
            docker pull "${{ steps.pin.outputs.target_tag }}"
            pushed="$(docker image inspect --format '{{index .RepoDigests 0}}' "${{ steps.pin.outputs.target_tag }}")"
          fi
          pushed_digest="${pushed##*@}"
          expected="${{ steps.pin.outputs.digest }}"
          echo "expected=${expected}"
          echo "pushed=${pushed_digest}"
          if [[ "${pushed_digest}" != "${expected}" ]]; then
            echo "::warning::Pushed digest ${pushed_digest} differs from source pin ${expected}. Consumers use the source pin digest; confirm registry accepted content-identical layers."
          fi

      - name: Record mirror digest
        run: |
          printf '%s\n' '${{ steps.pin.outputs.digest }}' > "${{ matrix.image }}-mirror.digest"
          printf '%s\n' '${{ steps.pin.outputs.target_tag }}' > "${{ matrix.image }}-mirror.tag"

      - name: Upload mirror metadata
        uses: actions/upload-artifact@v7
        with:
          name: third-party-mirror-${{ matrix.image }}
          path: |
            ${{ matrix.image }}-mirror.digest
            ${{ matrix.image }}-mirror.tag
          retention-days: 180
