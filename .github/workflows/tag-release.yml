name: Tag release

on:
  push:
    branches:
      - main
    paths:
      - "package.json"
      - "CHANGELOG.md"
      - "packages/config/src/app-version.ts"
      - "apps/**/package.json"
      - "packages/**/package.json"

concurrency:
  group: tag-release-${{ github.sha }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  tag-release:
    name: Create version tag
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Detect untagged release
        id: detect
        run: |
          set -euo pipefail
          version="$(jq -r .version package.json)"
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Invalid version: $version" >&2
            exit 1
          fi

          tag="v${version}"
          app_version="$(sed -n 's/^export const appVersion = "\(.*\)";$/\1/p' packages/config/src/app-version.ts | head -n1)"
          if [[ "$app_version" != "$version" ]]; then
            echo "app-version.ts ($app_version) does not match package.json ($version); skipping."
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if git ls-remote --exit-code --tags origin "refs/tags/${tag}" >/dev/null 2>&1; then
            echo "Tag ${tag} already exists; skipping."
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if ! grep -qE "^## ${version//./\\.} - " CHANGELOG.md; then
            echo "CHANGELOG.md has no section for ${version}; skipping."
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          before="${{ github.event.before }}"
          if [[ -z "$before" || "$before" =~ ^0+$ ]]; then
            range="HEAD"
          else
            range="${before}..HEAD"
          fi

          if ! git log --format=%s "$range" | grep -qx "Release ${version}"; then
            echo "No 'Release ${version}' commit in ${range}; skipping."
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          {
            echo "skip=false"
            echo "version=$version"
            echo "tag=$tag"
          } >> "$GITHUB_OUTPUT"

      - name: Create annotated tag and GitHub Release
        if: steps.detect.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.detect.outputs.version }}
          TAG: ${{ steps.detect.outputs.tag }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          notes_file="$(mktemp)"
          awk -v version="$VERSION" '
            $0 ~ "^## " version " - " {capture=1; next}
            capture && /^## / {exit}
            capture && NF {print}
          ' CHANGELOG.md > "$notes_file"

          if [[ ! -s "$notes_file" ]]; then
            echo "- Release ${VERSION}" > "$notes_file"
          fi

          git tag -a "$TAG" -m "Release ${VERSION}"
          git push origin "$TAG"

          gh release create "$TAG" \
            --title "Tavi ${VERSION}" \
            --notes-file "$notes_file" \
            --target "${{ github.sha }}"
