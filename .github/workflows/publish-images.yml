name: Publish container images

on:
  pull_request:
    paths:
      - ".dockerignore"
      - ".github/dependabot.yml"
      - ".github/workflows/automerge-dependencies.yml"
      - ".github/workflows/publish-images.yml"
      - ".github/workflows/refresh-images.yml"
      - "apps/**"
      - "packages/**"
      - "infra/docker/**"
      - "scripts/update-release-pins.mjs"
      - "package.json"
      - ".node-version"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "turbo.json"
      - "tsconfig.base.json"
  push:
    branches:
      - main
    tags:
      - "v*"
    paths:
      - ".dockerignore"
      - ".github/dependabot.yml"
      - ".github/workflows/automerge-dependencies.yml"
      - ".github/workflows/publish-images.yml"
      - ".github/workflows/refresh-images.yml"
      - "apps/**"
      - "packages/**"
      - "infra/docker/**"
      - "scripts/update-release-pins.mjs"
      - "package.json"
      - ".node-version"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "turbo.json"
      - "tsconfig.base.json"
  workflow_dispatch:

concurrency:
  group: publish-images-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate workspace
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version-file: .node-version

      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies
        run: corepack pnpm install --frozen-lockfile

      - name: Prepare generated artifacts
        run: |
          corepack pnpm --filter @tavi/config build
          corepack pnpm --filter @tavi/schemas build
          corepack pnpm --filter @tavi/api prisma:generate

      - name: Lint
        run: corepack pnpm lint

      - name: Typecheck
        run: corepack pnpm typecheck

      - name: Test
        run: corepack pnpm test

  build-and-publish:
    name: Build ${{ matrix.service }} image
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      attestations: write
      contents: read
      id-token: write
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: api
            image: tavi-api
            dockerfile: infra/docker/api.Dockerfile
          - service: web
            image: tavi-web
            dockerfile: infra/docker/web.Dockerfile
          - service: worker
            image: tavi-worker
            dockerfile: infra/docker/worker.Dockerfile

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Normalize GHCR owner
        id: vars
        run: echo "owner=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"

      - name: Set build metadata
        id: build-metadata
        run: echo "date=$(date -u +'%Y-%m-%dT%H:%M:%SZ')" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate image metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ steps.vars.outputs.owner }}/${{ matrix.image }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=branch
            type=ref,event=tag
            type=sha,prefix=sha-
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.title=${{ matrix.image }}

      - name: Build and publish image
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          pull: true
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            TAVI_BUILD_SHA=${{ github.sha }}
            TAVI_BUILD_DATE=${{ steps.build-metadata.outputs.date }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,scope=${{ matrix.image }},mode=max,ignore-error=true
          provenance: ${{ github.event_name != 'pull_request' && 'mode=max' || 'false' }}
          sbom: ${{ github.event_name != 'pull_request' }}

      - name: Generate CycloneDX SBOM
        if: github.event_name != 'pull_request'
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ghcr.io/${{ steps.vars.outputs.owner }}/${{ matrix.image }}@${{ steps.build.outputs.digest }}
          format: cyclonedx
          output: ${{ matrix.service }}.cdx.json
          exit-code: "0"

      - name: Upload CycloneDX SBOM
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.service }}-cyclonedx
          path: ${{ matrix.service }}.cdx.json
          retention-days: 180

      - name: Scan published image with Trivy
        if: github.event_name != 'pull_request'
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ghcr.io/${{ steps.vars.outputs.owner }}/${{ matrix.image }}@${{ steps.build.outputs.digest }}
          format: table
          output: ${{ matrix.service }}-trivy.txt
          severity: HIGH,CRITICAL
          scanners: vuln
          trivyignores: .trivyignore.yaml
          exit-code: "0"

      - name: Upload published image scan report
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.service }}-trivy-report
          path: ${{ matrix.service }}-trivy.txt
          retention-days: 180

      - name: Save published image digest
        if: github.event_name != 'pull_request'
        run: printf '%s\n' '${{ steps.build.outputs.digest }}' > ${{ matrix.service }}.digest

      - name: Upload published image digest
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v7
        with:
          name: image-digest-${{ matrix.service }}
          path: ${{ matrix.service }}.digest
          retention-days: 180

  create-release-pin-pull-request:
    name: Create immutable release-pin pull request
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: build-and-publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Check out default branch
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.repository.default_branch }}

      - name: Normalize GHCR owner
        id: vars
        run: echo "owner=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"

      - name: Download published image digests
        uses: actions/download-artifact@v8
        with:
          pattern: image-digest-*
          path: image-digests
          merge-multiple: true

      - name: Update immutable image references
        env:
          API_DIGEST_FILE: image-digests/api.digest
          RELEASE_TAG: ${{ github.ref_name }}
          GHCR_OWNER: ${{ steps.vars.outputs.owner }}
          WEB_DIGEST_FILE: image-digests/web.digest
          WORKER_DIGEST_FILE: image-digests/worker.digest
        run: |
          set -euo pipefail
          api_digest="$(cat "$API_DIGEST_FILE")"
          web_digest="$(cat "$WEB_DIGEST_FILE")"
          worker_digest="$(cat "$WORKER_DIGEST_FILE")"

          node scripts/update-release-pins.mjs \
            --api "ghcr.io/$GHCR_OWNER/tavi-api:$RELEASE_TAG@$api_digest" \
            --web "ghcr.io/$GHCR_OWNER/tavi-web:$RELEASE_TAG@$web_digest" \
            --worker "ghcr.io/$GHCR_OWNER/tavi-worker:$RELEASE_TAG@$worker_digest"

      - name: Create release-pin pull request
        uses: peter-evans/create-pull-request@v7
        with:
          branch: automation/release-pins-${{ github.ref_name }}
          commit-message: "chore(release): pin ${{ github.ref_name }} image digests"
          delete-branch: true
          body: |
            Pins Docker Compose and every supported Kubernetes deployment variant to the immutable images published for `${{ github.ref_name }}`.

            Each image uses both the release tag and its content digest. Review and merge this promotion pull request to deploy the release.
          title: "chore(release): pin ${{ github.ref_name }} images"
