name: Publish container images

on:
  # This workflow's job names are required by main branch protection.
  pull_request:
  push:
    branches:
      - main
    tags:
      - "v*"
    paths:
      - ".dockerignore"
      - ".github/dependabot.yml"
      - ".github/workflows/automerge-dependencies.yml"
      - ".github/workflows/cut-release.yml"
      - ".github/workflows/publish-images.yml"
      - ".github/workflows/refresh-images.yml"
      - ".github/workflows/tag-release.yml"
      - ".github/workflows/trivy-scan.yml"
      - "apps/**"
      - "packages/**"
      - "infra/docker/**"
      - "scripts/**"
      - "package.json"
      - ".node-version"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "turbo.json"
      - "tsconfig.base.json"
  workflow_dispatch:

concurrency:
  group: publish-images-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Detect container-relevant changes
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      container_inputs: ${{ steps.filter.outputs.container_inputs }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Detect container-relevant changes
        id: filter
        uses: dorny/paths-filter@v4
        with:
          filters: |
            container_inputs:
              - ".dockerignore"
              - ".trivyignore.yaml"
              - ".github/dependabot.yml"
              - ".github/workflows/automerge-dependencies.yml"
              - ".github/workflows/cut-release.yml"
              - ".github/workflows/publish-images.yml"
              - ".github/workflows/refresh-images.yml"
              - ".github/workflows/tag-release.yml"
              - ".github/workflows/trivy-scan.yml"
              - "apps/**"
              - "packages/**"
              - "infra/docker/**"
              - "scripts/**"
              - "package.json"
              - ".node-version"
              - "pnpm-lock.yaml"
              - "pnpm-workspace.yaml"
              - "turbo.json"
              - "tsconfig.base.json"

  # Branch protection requires these exact check names. When a PR has no
  # container-relevant paths, emit successful placeholder runs so docs/CI-only
  # PRs are not permanently blocked by skipped required checks.
  validate-not-required:
    name: Validate workspace
    needs: changes
    if: >-
      github.event_name == 'pull_request' &&
      needs.changes.result == 'success' &&
      needs.changes.outputs.container_inputs != 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Mark required check successful
        run: echo "No container-relevant changes; validation not required."

  build-not-required:
    name: Build ${{ matrix.service }} image
    needs: changes
    if: >-
      github.event_name == 'pull_request' &&
      needs.changes.result == 'success' &&
      needs.changes.outputs.container_inputs != 'true'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [api, web, worker]
    steps:
      - name: Mark required check successful
        run: echo "No container-relevant changes; ${{ matrix.service }} image build not required."

  validate:
    name: Validate workspace
    needs: changes
    if: >-
      always() &&
      (
        github.event_name != 'pull_request' ||
        needs.changes.result != 'success' ||
        needs.changes.outputs.container_inputs == 'true'
      )
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version-file: .node-version

      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies
        run: corepack pnpm install --frozen-lockfile

      - name: Prepare generated artifacts
        run: |
          corepack pnpm --filter @tavi/config build
          corepack pnpm --filter @tavi/schemas build
          corepack pnpm --filter @tavi/api prisma:generate

      - name: Lint
        run: corepack pnpm lint

      - name: Typecheck
        run: corepack pnpm typecheck

      - name: Test
        run: corepack pnpm test

  build-and-publish:
    name: Build ${{ matrix.service }} image
    needs:
      - changes
      - validate
    if: >-
      always() &&
      needs.validate.result == 'success' &&
      (
        github.event_name != 'pull_request' ||
        needs.changes.result != 'success' ||
        needs.changes.outputs.container_inputs == 'true'
      )
    runs-on: ubuntu-latest
    permissions:
      attestations: write
      contents: read
      id-token: write
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: api
            image: tavi-api
            dockerfile: infra/docker/api.Dockerfile
          - service: web
            image: tavi-web
            dockerfile: infra/docker/web.Dockerfile
          - service: worker
            image: tavi-worker
            dockerfile: infra/docker/worker.Dockerfile

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Normalize GHCR owner
        id: vars
        run: echo "owner=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"

      - name: Set build metadata
        id: build-metadata
        run: echo "date=$(date -u +'%Y-%m-%dT%H:%M:%SZ')" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate image metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ steps.vars.outputs.owner }}/${{ matrix.image }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=branch
            type=ref,event=tag
            type=sha,prefix=sha-
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.title=${{ matrix.image }}

      - name: Build and publish image
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          pull: true
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            TAVI_BUILD_SHA=${{ github.sha }}
            TAVI_BUILD_DATE=${{ steps.build-metadata.outputs.date }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,scope=${{ matrix.image }},mode=max,ignore-error=true
          provenance: ${{ github.event_name != 'pull_request' && 'mode=max' || 'false' }}
          sbom: ${{ github.event_name != 'pull_request' }}

      - name: Generate CycloneDX SBOM
        if: github.event_name != 'pull_request'
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ghcr.io/${{ steps.vars.outputs.owner }}/${{ matrix.image }}@${{ steps.build.outputs.digest }}
          format: cyclonedx
          output: ${{ matrix.service }}.cdx.json
          exit-code: "0"

      - name: Upload CycloneDX SBOM
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.service }}-cyclonedx
          path: ${{ matrix.service }}.cdx.json
          retention-days: 180

      - name: Scan published image with Trivy
        if: github.event_name != 'pull_request'
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ghcr.io/${{ steps.vars.outputs.owner }}/${{ matrix.image }}@${{ steps.build.outputs.digest }}
          format: table
          output: ${{ matrix.service }}-trivy.txt
          severity: HIGH,CRITICAL
          scanners: vuln
          trivyignores: .trivyignore.yaml
          exit-code: "0"

      - name: Upload published image scan report
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.service }}-trivy-report
          path: ${{ matrix.service }}-trivy.txt
          retention-days: 180

      - name: Save published image digest
        if: github.event_name != 'pull_request'
        run: printf '%s\n' '${{ steps.build.outputs.digest }}' > ${{ matrix.service }}.digest

      - name: Upload published image digest
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v7
        with:
          name: image-digest-${{ matrix.service }}
          path: ${{ matrix.service }}.digest
          retention-days: 180

  build-and-publish-internal:
    name: Publish internal ${{ matrix.service }} image
    # always() is required so a skipped PR-only `changes` ancestor does not
    # suppress this job on trusted main/tag pushes.
    if: >-
      always() &&
      needs.validate.result == 'success' &&
      github.event_name == 'push' &&
      (
        github.ref == 'refs/heads/main' ||
        startsWith(github.ref, 'refs/tags/v')
      )
    needs: validate
    runs-on:
      - self-hosted
      - docker-wtg
    permissions:
      contents: read
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        include:
          - service: api
            image: tavi-api
            dockerfile: infra/docker/api.Dockerfile
          - service: web
            image: tavi-web
            dockerfile: infra/docker/web.Dockerfile
          - service: worker
            image: tavi-worker
            dockerfile: infra/docker/worker.Dockerfile

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Log in to Artifactory
        uses: docker/login-action@v4
        with:
          registry: sv4.art.e2open.com
          username: ${{ secrets.ARTIFACTORY_USERNAME }}
          password: ${{ secrets.ARTIFACTORY_RW_TOKEN }}

      - name: Set build metadata
        id: build-metadata
        run: echo "date=$(date -u +'%Y-%m-%dT%H:%M:%SZ')" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Generate image metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: sv4.art.e2open.com/dcops-docker-repo/${{ matrix.image }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=branch
            type=ref,event=tag
            type=sha,prefix=sha-
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.title=${{ matrix.image }}

      - name: Build and publish internal image
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          pull: true
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            TAVI_BUILD_SHA=${{ github.sha }}
            TAVI_BUILD_DATE=${{ steps.build-metadata.outputs.date }}
          cache-from: type=gha,scope=internal-${{ matrix.image }}
          cache-to: type=gha,scope=internal-${{ matrix.image }},mode=max,ignore-error=true
          provenance: mode=max
          sbom: true

      - name: Scan published internal image with Trivy
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: sv4.art.e2open.com/dcops-docker-repo/${{ matrix.image }}@${{ steps.build.outputs.digest }}
          format: table
          output: internal-${{ matrix.service }}-trivy.txt
          severity: HIGH,CRITICAL
          scanners: vuln
          trivyignores: .trivyignore.yaml
          exit-code: "1"

      - name: Upload internal image scan report
        if: success() || failure()
        uses: actions/upload-artifact@v7
        with:
          name: internal-${{ matrix.service }}-trivy-report
          path: internal-${{ matrix.service }}-trivy.txt
          retention-days: 180

      - name: Save internal image digest
        run: printf '%s\n' '${{ steps.build.outputs.digest }}' > internal-${{ matrix.service }}.digest

      - name: Upload internal image digest
        uses: actions/upload-artifact@v7
        with:
          name: internal-image-digest-${{ matrix.service }}
          path: internal-${{ matrix.service }}.digest
          retention-days: 180

  # Candidate lane only: after internal sha-* images land in Artifactory, roll
  # them onto the non-prod tavi-dev namespace via the jump-host update helper.
  # Production/K8s release pins remain the separate v* release-pin PR path.
  deploy-tavi-dev:
    name: Deploy candidates to tavi-dev
    if: >-
      always() &&
      needs.build-and-publish-internal.result == 'success' &&
      github.event_name == 'push' &&
      (
        github.ref == 'refs/heads/main' ||
        startsWith(github.ref, 'refs/tags/v')
      )
    needs:
      - build-and-publish-internal
    runs-on:
      - self-hosted
      - docker-wtg
    permissions:
      contents: read
    concurrency:
      group: deploy-tavi-dev
      cancel-in-progress: false
    steps:
      - name: Resolve candidate SHA tag
        id: candidate
        shell: bash
        run: |
          set -euo pipefail
          # Match docker/metadata-action type=sha default short length (7).
          short_sha="$(printf '%s' '${{ github.sha }}' | cut -c1-7)"
          echo "short_sha=${short_sha}" >> "$GITHUB_OUTPUT"
          echo "image_tag=sha-${short_sha}" >> "$GITHUB_OUTPUT"

      - name: Download internal image digests
        uses: actions/download-artifact@v8
        with:
          pattern: internal-image-digest-*
          path: internal-image-digests
          merge-multiple: true

      - name: Deploy sha candidate via jump-host update.sh
        shell: bash
        env:
          TAVI_DEV_SSH_KEY: ${{ secrets.TAVI_DEV_SSH_KEY }}
          TAVI_DEV_SSH_HOST: ${{ secrets.TAVI_DEV_SSH_HOST }}
          TAVI_DEV_SSH_USER: ${{ secrets.TAVI_DEV_SSH_USER }}
          TAVI_DEV_UPDATE_SCRIPT: ${{ vars.TAVI_DEV_UPDATE_SCRIPT }}
          VKS_PASSCODE: ${{ secrets.VKS_PASSCODE }}
          CANDIDATE_SHA: ${{ steps.candidate.outputs.short_sha }}
          IMAGE_TAG: ${{ steps.candidate.outputs.image_tag }}
        run: |
          set -euo pipefail

          : "${TAVI_DEV_SSH_KEY:?Set repository secret TAVI_DEV_SSH_KEY (private key for sv4d-jump)}"
          : "${TAVI_DEV_SSH_HOST:?Set repository secret TAVI_DEV_SSH_HOST (for example sv4d-jump)}"
          : "${TAVI_DEV_SSH_USER:?Set repository secret TAVI_DEV_SSH_USER}"
          : "${VKS_PASSCODE:?Set repository secret VKS_PASSCODE (k8s-login passcode for stored VKS creds)}"
          update_script="${TAVI_DEV_UPDATE_SCRIPT:-/e2open/home/mkronvold/src/tavi-dev/update.sh}"

          api_digest="$(tr -d '[:space:]' < internal-image-digests/internal-api.digest)"
          web_digest="$(tr -d '[:space:]' < internal-image-digests/internal-web.digest)"
          worker_digest="$(tr -d '[:space:]' < internal-image-digests/internal-worker.digest)"
          test -n "${api_digest}"
          test -n "${web_digest}"
          test -n "${worker_digest}"

          tmp_key="$(mktemp)"
          cleanup() { rm -f "${tmp_key}"; }
          trap cleanup EXIT
          printf '%s\n' "${TAVI_DEV_SSH_KEY}" > "${tmp_key}"
          chmod 600 "${tmp_key}"

          mkdir -p "${HOME}/.ssh"
          chmod 700 "${HOME}/.ssh"
          if ! ssh-keygen -F "${TAVI_DEV_SSH_HOST}" -f "${HOME}/.ssh/known_hosts" >/dev/null 2>&1; then
            ssh-keyscan -H "${TAVI_DEV_SSH_HOST}" >> "${HOME}/.ssh/known_hosts"
          fi

          echo "Deploying Artifactory candidates ${IMAGE_TAG} to tavi-dev via ${TAVI_DEV_SSH_USER}@${TAVI_DEV_SSH_HOST}"
          echo "update.sh=${update_script}"
          echo "api_digest=${api_digest}"
          echo "web_digest=${web_digest}"
          echo "worker_digest=${worker_digest}"

          # update.sh expects the short commit id (no sha- prefix). Digests are
          # exported for helpers that can pin repo.ops references by digest.
          # k8s-login on the jump host decrypts stored VKS credentials with PASSCODE
          # (VKS_PASSCODE secret). Prefer unattended login before apply.
          ssh \
            -i "${tmp_key}" \
            -o BatchMode=yes \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            "${TAVI_DEV_SSH_USER}@${TAVI_DEV_SSH_HOST}" \
            "export PASSCODE=$(printf '%q' "${VKS_PASSCODE}") VKS_PASSCODE=$(printf '%q' "${VKS_PASSCODE}") TAVI_CANDIDATE_SHA=$(printf '%q' "${CANDIDATE_SHA}") TAVI_IMAGE_TAG=$(printf '%q' "${IMAGE_TAG}") TAVI_API_DIGEST=$(printf '%q' "${api_digest}") TAVI_WEB_DIGEST=$(printf '%q' "${web_digest}") TAVI_WORKER_DIGEST=$(printf '%q' "${worker_digest}") K8S_NAMESPACE=tavi-dev; if command -v k8s-login >/dev/null 2>&1; then k8s-login --unattended -c \"\${K8S_CLUSTER:-sv4d-cops-nonp}\" || k8s-login -c \"\${K8S_CLUSTER:-sv4d-cops-nonp}\"; fi; exec $(printf '%q' "${update_script}") $(printf '%q' "${CANDIDATE_SHA}")"

  create-release-pin-pull-request:
    name: Create immutable release-pin pull request
    if: >-
      always() &&
      needs.build-and-publish.result == 'success' &&
      needs.build-and-publish-internal.result == 'success' &&
      github.event_name == 'push' &&
      startsWith(github.ref, 'refs/tags/v')
    needs:
      - build-and-publish
      - build-and-publish-internal
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Check out default branch
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.repository.default_branch }}

      - name: Normalize GHCR owner
        id: vars
        run: echo "owner=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"

      - name: Download published image digests
        uses: actions/download-artifact@v8
        with:
          pattern: image-digest-*
          path: image-digests
          merge-multiple: true

      - name: Download internal image digests
        uses: actions/download-artifact@v8
        with:
          pattern: internal-image-digest-*
          path: internal-image-digests
          merge-multiple: true

      - name: Update immutable image references
        env:
          API_DIGEST_FILE: image-digests/api.digest
          INTERNAL_API_DIGEST_FILE: internal-image-digests/internal-api.digest
          RELEASE_TAG: ${{ github.ref_name }}
          GHCR_OWNER: ${{ steps.vars.outputs.owner }}
          WEB_DIGEST_FILE: image-digests/web.digest
          INTERNAL_WEB_DIGEST_FILE: internal-image-digests/internal-web.digest
          WORKER_DIGEST_FILE: image-digests/worker.digest
          INTERNAL_WORKER_DIGEST_FILE: internal-image-digests/internal-worker.digest
        run: |
          set -euo pipefail
          api_digest="$(cat "$API_DIGEST_FILE")"
          web_digest="$(cat "$WEB_DIGEST_FILE")"
          worker_digest="$(cat "$WORKER_DIGEST_FILE")"
          internal_api_digest="$(cat "$INTERNAL_API_DIGEST_FILE")"
          internal_web_digest="$(cat "$INTERNAL_WEB_DIGEST_FILE")"
          internal_worker_digest="$(cat "$INTERNAL_WORKER_DIGEST_FILE")"

          node scripts/update-release-pins.mjs \
            --api "ghcr.io/$GHCR_OWNER/tavi-api:$RELEASE_TAG@$api_digest" \
            --web "ghcr.io/$GHCR_OWNER/tavi-web:$RELEASE_TAG@$web_digest" \
            --worker "ghcr.io/$GHCR_OWNER/tavi-worker:$RELEASE_TAG@$worker_digest" \
            --api-k8s "repo.ops.e2open.com/dcops-docker-repo/tavi-api:$RELEASE_TAG@$internal_api_digest" \
            --web-k8s "repo.ops.e2open.com/dcops-docker-repo/tavi-web:$RELEASE_TAG@$internal_web_digest" \
            --worker-k8s "repo.ops.e2open.com/dcops-docker-repo/tavi-worker:$RELEASE_TAG@$internal_worker_digest"

      - name: Create release-pin pull request
        uses: peter-evans/create-pull-request@v8
        with:
          branch: automation/release-pins-${{ github.ref_name }}
          commit-message: "chore(release): pin ${{ github.ref_name }} image digests"
          delete-branch: true
          body: |
            Pins Docker Compose and every supported Kubernetes deployment variant to the immutable images published for `${{ github.ref_name }}`.

            Compose uses public GHCR `tag@sha256:digest` references. Every Kubernetes deployment variant uses `repo.ops.e2open.com/dcops-docker-repo` `tag@sha256:digest` references. Review and merge this promotion pull request to deploy the release.
          title: "chore(release): pin ${{ github.ref_name }} images"
