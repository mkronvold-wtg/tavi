version: 2
registries:
  # sv4.art and repo.ops are CNAME aliases of the same Artifactory edge in dev.
  # Push uses ARTIFACTORY_RW_TOKEN in Actions; Dependabot only pulls, so it uses
  # the read-only token. Username is shared (ARTIFACTORY_USERNAME).
  artifactory-sv4:
    type: docker-registry
    url: https://sv4.art.e2open.com
    username: ${{ secrets.ARTIFACTORY_USERNAME }}
    password: ${{ secrets.ARTIFACTORY_RO_TOKEN }}
  artifactory-repo-ops:
    type: docker-registry
    url: https://repo.ops.e2open.com
    username: ${{ secrets.ARTIFACTORY_USERNAME }}
    password: ${{ secrets.ARTIFACTORY_RO_TOKEN }}

updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    # Hold TypeScript majors until Nest CLI and typescript-eslint support TS 7+.
    # TS 7.0 drops the programmatic compiler API Nest needs and is outside
    # typescript-eslint's supported peer range (<6.1 today).
    ignore:
      - dependency-name: "typescript"
        update-types:
          - "version-update:semver-major"
    groups:
      npm-all:
        patterns:
          - "*"
        update-types:
          - major
          - minor
          - patch

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions-all:
        patterns:
          - "*"
        update-types:
          - major
          - minor
          - patch

  - package-ecosystem: docker
    directory: /infra/docker
    schedule:
      interval: weekly
    registries:
      - artifactory-sv4
      - artifactory-repo-ops
    groups:
      docker-all:
        patterns:
          - "*"
        update-types:
          - major
          - minor
          - patch

  # Only track public third-party images in Kubernetes manifests (for example
  # postgres). Tavi api/web/worker pins are immutable release artifacts updated
  # by the publish/release-pin path, not Dependabot.
  - package-ecosystem: docker
    directory: /infra/k8s/k8s-with-external-db
    schedule:
      interval: weekly
    registries:
      - artifactory-sv4
      - artifactory-repo-ops
    ignore:
      - dependency-name: "repo.ops.e2open.com/dcops-docker-repo/tavi-api"
      - dependency-name: "repo.ops.e2open.com/dcops-docker-repo/tavi-web"
      - dependency-name: "repo.ops.e2open.com/dcops-docker-repo/tavi-worker"
      - dependency-name: "sv4.art.e2open.com/dcops-docker-repo/tavi-api"
      - dependency-name: "sv4.art.e2open.com/dcops-docker-repo/tavi-web"
      - dependency-name: "sv4.art.e2open.com/dcops-docker-repo/tavi-worker"

  - package-ecosystem: docker
    directory: /infra/k8s/k8s-with-internal-db
    schedule:
      interval: weekly
    registries:
      - artifactory-sv4
      - artifactory-repo-ops
    ignore:
      - dependency-name: "repo.ops.e2open.com/dcops-docker-repo/tavi-api"
      - dependency-name: "repo.ops.e2open.com/dcops-docker-repo/tavi-web"
      - dependency-name: "repo.ops.e2open.com/dcops-docker-repo/tavi-worker"
      - dependency-name: "sv4.art.e2open.com/dcops-docker-repo/tavi-api"
      - dependency-name: "sv4.art.e2open.com/dcops-docker-repo/tavi-web"
      - dependency-name: "sv4.art.e2open.com/dcops-docker-repo/tavi-worker"

  - package-ecosystem: docker
    directory: /infra/k8s/k8s-with-replicas-and-external-db
    schedule:
      interval: weekly
    registries:
      - artifactory-sv4
      - artifactory-repo-ops
    ignore:
      - dependency-name: "repo.ops.e2open.com/dcops-docker-repo/tavi-api"
      - dependency-name: "repo.ops.e2open.com/dcops-docker-repo/tavi-web"
      - dependency-name: "repo.ops.e2open.com/dcops-docker-repo/tavi-worker"
      - dependency-name: "sv4.art.e2open.com/dcops-docker-repo/tavi-api"
      - dependency-name: "sv4.art.e2open.com/dcops-docker-repo/tavi-web"
      - dependency-name: "sv4.art.e2open.com/dcops-docker-repo/tavi-worker"

  - package-ecosystem: docker
    directory: /infra/k8s/k8s-with-replicas-and-internal-ha-db
    schedule:
      interval: weekly
    registries:
      - artifactory-sv4
      - artifactory-repo-ops
    ignore:
      - dependency-name: "repo.ops.e2open.com/dcops-docker-repo/tavi-api"
      - dependency-name: "repo.ops.e2open.com/dcops-docker-repo/tavi-web"
      - dependency-name: "repo.ops.e2open.com/dcops-docker-repo/tavi-worker"
      - dependency-name: "sv4.art.e2open.com/dcops-docker-repo/tavi-api"
      - dependency-name: "sv4.art.e2open.com/dcops-docker-repo/tavi-web"
      - dependency-name: "sv4.art.e2open.com/dcops-docker-repo/tavi-worker"
