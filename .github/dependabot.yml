version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    # Hold TypeScript majors until Nest CLI and typescript-eslint support TS 7+.
    # TS 7.0 drops the programmatic compiler API Nest needs and is outside
    # typescript-eslint's supported peer range (<6.1 today).
    ignore:
      - dependency-name: "typescript"
        update-types:
          - "version-update:semver-major"
    groups:
      npm-all:
        patterns:
          - "*"
        update-types:
          - major
          - minor
          - patch

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions-all:
        patterns:
          - "*"
        update-types:
          - major
          - minor
          - patch

  - package-ecosystem: docker
    directory: /infra/docker
    schedule:
      interval: weekly
    groups:
      docker-all:
        patterns:
          - "*"
        update-types:
          - major
          - minor
          - patch

  - package-ecosystem: docker
    directory: /infra/k8s/k8s-with-external-db
    schedule:
      interval: weekly

  - package-ecosystem: docker
    directory: /infra/k8s/k8s-with-internal-db
    schedule:
      interval: weekly

  - package-ecosystem: docker
    directory: /infra/k8s/k8s-with-replicas-and-external-db
    schedule:
      interval: weekly

  - package-ecosystem: docker
    directory: /infra/k8s/k8s-with-replicas-and-internal-ha-db
    schedule:
      interval: weekly
