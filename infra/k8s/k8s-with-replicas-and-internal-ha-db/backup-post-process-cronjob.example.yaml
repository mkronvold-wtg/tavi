apiVersion: batch/v1
kind: CronJob
metadata:
  name: tavi-backup-post-process
  namespace: tavi
spec:
  schedule: "30 2 * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      template:
        spec:
          restartPolicy: OnFailure
          securityContext:
            runAsNonRoot: true
            runAsUser: 10001
            runAsGroup: 10001
            fsGroup: 10001
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: archive-backups
              image: alpine:3.24@sha256:294b683cb724975bec92580e1e685676bd4b50bda910ddb8c51d4cabeaec77e6
              securityContext:
                seccompProfile:
                  type: RuntimeDefault
                privileged: false
                runAsNonRoot: true
                runAsUser: 10001
                runAsGroup: 10001
                readOnlyRootFilesystem: true
                capabilities:
                  drop:
                    - ALL
                allowPrivilegeEscalation: false
              resources:
                requests:
                  cpu: 50m
                  memory: 64Mi
                  ephemeral-storage: 64Mi
                limits:
                  cpu: 200m
                  memory: 256Mi
                  ephemeral-storage: 512Mi
              command: ["/bin/sh", "-lc"]
              args:
                - |
                  set -eu
                  archive_dir="/archive/$(date -u +%Y%m%dT%H%M%SZ)"
                  mkdir -p "${archive_dir}"
                  cp -av /backups/. "${archive_dir}/"
                  find /archive -mindepth 1 -maxdepth 1 -type d | sort | head -n -14 | xargs -r rm -rf --
              volumeMounts:
                - name: source-backups
                  mountPath: /backups
                  readOnly: true
                - name: archive-target
                  mountPath: /archive
                - name: tmp
                  mountPath: /tmp
          volumes:
            - name: source-backups
              persistentVolumeClaim:
                claimName: tavi-backups
            - name: archive-target
              persistentVolumeClaim:
                claimName: tavi-backup-archive
            - name: tmp
              emptyDir: {}