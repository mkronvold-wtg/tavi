apiVersion: apps/v1
kind: Deployment
metadata:
  name: tavi-web
  namespace: tavi
spec:
  replicas: 1
  selector:
    matchLabels:
      app: tavi-web
  template:
    metadata:
      labels:
        app: tavi-web
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      imagePullSecrets:
        - name: regcred
      containers:
        - name: web
          image: repo.ops.e2open.com/dcops-docker-repo/tavi-web:sha-69b0417@sha256:0cbb2372de0b38b0dc73c37bc936ee3f7dc1be988a55918f8e19b63bda6053ee
          imagePullPolicy: IfNotPresent
          securityContext:
            seccompProfile:
              type: RuntimeDefault
            privileged: false
            runAsNonRoot: true
            runAsUser: 10001
            runAsGroup: 10001
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
            allowPrivilegeEscalation: false
          resources:
            requests:
              cpu: 100m
              ephemeral-storage: 64Mi
              memory: 128Mi
            limits:
              cpu: 500m
              ephemeral-storage: 128Mi
              memory: 256Mi
          ports:
            - containerPort: 4173
          env:
            - name: VITE_API_BASE_URL
              valueFrom:
                configMapKeyRef:
                  name: tavi-config
                  key: VITE_API_BASE_URL
            - name: TAVI_HOME_URL
              valueFrom:
                configMapKeyRef:
                  name: tavi-config
                  key: TAVI_HOME_URL
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
