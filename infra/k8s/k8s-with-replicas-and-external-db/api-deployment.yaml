apiVersion: apps/v1
kind: Deployment
metadata:
  name: tavi-api
  namespace: tavi
spec:
  replicas: 3
  selector:
    matchLabels:
      app: tavi-api
  template:
    metadata:
      annotations:
        prometheus.io/path: /api/metrics
        prometheus.io/port: "4000"
        prometheus.io/scrape: "true"
      labels:
        app: tavi-api
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        - name: migrate
          image: repo.ops.e2open.com/dcops-docker-repo/tavi-api:sha-69b0417@sha256:05e049f92154a992e2f033a9967419e5a6611b6983b1f51ae44dad82c61dc376
          imagePullPolicy: IfNotPresent
          securityContext:
            seccompProfile:
              type: RuntimeDefault
            privileged: false
            runAsNonRoot: true
            runAsUser: 10001
            runAsGroup: 10001
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
            allowPrivilegeEscalation: false
          resources:
            requests:
              cpu: 100m
              ephemeral-storage: 64Mi
              memory: 128Mi
            limits:
              cpu: 500m
              ephemeral-storage: 256Mi
              memory: 256Mi
          volumeMounts:
            - name: tmp
              mountPath: /tmp
          command: ["node", "node_modules/prisma/build/index.js", "migrate", "deploy"]
          env:
            - name: PORT
              valueFrom:
                configMapKeyRef:
                  name: tavi-config
                  key: API_PORT
            - name: CORS_ORIGIN
              valueFrom:
                configMapKeyRef:
                  name: tavi-config
                  key: CORS_ORIGIN
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: tavi-secrets
                  key: DATABASE_URL
            - name: COOKIE_SECRET
              valueFrom:
                secretKeyRef:
                  name: tavi-secrets
                  key: COOKIE_SECRET
      imagePullSecrets:
        - name: regcred
      containers:
        - name: api
          image: repo.ops.e2open.com/dcops-docker-repo/tavi-api:sha-69b0417@sha256:05e049f92154a992e2f033a9967419e5a6611b6983b1f51ae44dad82c61dc376
          imagePullPolicy: IfNotPresent
          securityContext:
            seccompProfile:
              type: RuntimeDefault
            privileged: false
            runAsNonRoot: true
            runAsUser: 10001
            runAsGroup: 10001
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
            allowPrivilegeEscalation: false
          resources:
            requests:
              cpu: 200m
              ephemeral-storage: 64Mi
              memory: 256Mi
            limits:
              cpu: 1000m
              ephemeral-storage: 256Mi
              memory: 512Mi
          ports:
            - containerPort: 4000
          env:
            - name: PORT
              valueFrom:
                configMapKeyRef:
                  name: tavi-config
                  key: API_PORT
            - name: CORS_ORIGIN
              valueFrom:
                configMapKeyRef:
                  name: tavi-config
                  key: CORS_ORIGIN
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: tavi-secrets
                  key: DATABASE_URL
            - name: COOKIE_SECRET
              valueFrom:
                secretKeyRef:
                  name: tavi-secrets
                  key: COOKIE_SECRET
            - name: SMTP_URL
              valueFrom:
                secretKeyRef:
                  name: tavi-secrets
                  key: SMTP_URL
                  optional: true
            - name: SMTP_FROM
              valueFrom:
                configMapKeyRef:
                  name: tavi-config
                  key: SMTP_FROM
            - name: TAVI_HOME_URL
              valueFrom:
                configMapKeyRef:
                  name: tavi-config
                  key: TAVI_HOME_URL
            - name: BACKUP_DIRECTORY
              valueFrom:
                configMapKeyRef:
                  name: tavi-config
                  key: BACKUP_DIRECTORY
          volumeMounts:
            - name: tavi-backups
              mountPath: /var/tavi/backups
            - name: tmp
              mountPath: /tmp
          readinessProbe:
            httpGet:
              path: /api/health
              port: 4000
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /api/health
              port: 4000
            initialDelaySeconds: 20
            periodSeconds: 20
      volumes:
        - name: tavi-backups
          persistentVolumeClaim:
            claimName: tavi-backups
        - name: tmp
          emptyDir: {}
