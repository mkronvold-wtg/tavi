apiVersion: apps/v1
kind: Deployment
metadata:
  name: tavi-worker
  namespace: tavi
spec:
  replicas: 3
  selector:
    matchLabels:
      app: tavi-worker
  template:
    metadata:
      annotations:
        prometheus.io/path: /metrics
        prometheus.io/port: "4100"
        prometheus.io/scrape: "true"
      labels:
        app: tavi-worker
    spec:
      securityContext:
        fsGroup: 1000
      imagePullSecrets:
        - name: regcred
      containers:
        - name: worker
          image: repo.ops.e2open.com/dcops-docker-repo/tavi-worker:sha-69b0417@sha256:ee700eda62e8bacd79d0c225d463788e94064fc3275de983aededbe828deabf4
          imagePullPolicy: IfNotPresent
          securityContext:
            seccompProfile:
              type: RuntimeDefault
            privileged: false
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            capabilities:
              drop:
                - ALL
            allowPrivilegeEscalation: false
          resources:
            requests:
              cpu: 200m
              ephemeral-storage: 64Mi
              memory: 256Mi
            limits:
              cpu: 1000m
              ephemeral-storage: 256Mi
              memory: 512Mi
          ports:
            - containerPort: 4100
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: tavi-secrets
                  key: DATABASE_URL
            - name: PORT
              valueFrom:
                configMapKeyRef:
                  name: tavi-config
                  key: WORKER_PORT
            - name: SMTP_URL
              valueFrom:
                secretKeyRef:
                  name: tavi-secrets
                  key: SMTP_URL
                  optional: true
            - name: SMTP_FROM
              valueFrom:
                configMapKeyRef:
                  name: tavi-config
                  key: SMTP_FROM
            - name: TAVI_HOME_URL
              valueFrom:
                configMapKeyRef:
                  name: tavi-config
                  key: TAVI_HOME_URL
            - name: BACKUP_DIRECTORY
              valueFrom:
                configMapKeyRef:
                  name: tavi-config
                  key: BACKUP_DIRECTORY
          volumeMounts:
            - name: tavi-backups
              mountPath: /var/tavi/backups
          readinessProbe:
            httpGet:
              path: /health
              port: 4100
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 4100
            initialDelaySeconds: 20
            periodSeconds: 20
      volumes:
        - name: tavi-backups
          persistentVolumeClaim:
            claimName: tavi-backups
