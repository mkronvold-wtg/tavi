apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: tavi-postgres
  namespace: tavi
spec:
  serviceName: tavi-postgres-headless
  replicas: 1
  selector:
    matchLabels:
      app: tavi-postgres
  template:
    metadata:
      labels:
        app: tavi-postgres
    spec:
      securityContext:
        fsGroup: 1001
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      imagePullSecrets:
        - name: regcred
      containers:
        - name: postgres
          # Internal/BSI lane: Bitnami Secure Image from Artifactory (pull via repo.ops).
          # Source of truth: infra/images/bsi-postgresql.pin.json (sync with scripts/sync-bsi-pins.mjs).
          image: repo.ops.e2open.com/bitnami-docker-secure/containers/debian-12/postgresql@sha256:ee3a3613c33fabeb4c8dfb4344fa4293649017c7f07fb4fad5ceb2165ffc37a5
          imagePullPolicy: IfNotPresent
          securityContext:
            seccompProfile:
              type: RuntimeDefault
            privileged: false
            runAsNonRoot: true
            runAsUser: 1001
            runAsGroup: 1001
            capabilities:
              drop:
                - ALL
            allowPrivilegeEscalation: false
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: 1000m
              memory: 1Gi
          ports:
            - containerPort: 5432
              name: postgres
          env:
            # Bitnami env names; values still come from tavi-secrets POSTGRES_* keys
            # used by DATABASE_URL for the app.
            - name: POSTGRESQL_USERNAME
              valueFrom:
                secretKeyRef:
                  name: tavi-secrets
                  key: POSTGRES_USER
            - name: POSTGRESQL_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: tavi-secrets
                  key: POSTGRES_PASSWORD
            - name: POSTGRESQL_DATABASE
              valueFrom:
                secretKeyRef:
                  name: tavi-secrets
                  key: POSTGRES_DB
            - name: POSTGRESQL_POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: tavi-secrets
                  key: POSTGRES_PASSWORD
            - name: POSTGRESQL_VOLUME_DIR
              value: /bitnami/postgresql
            # Prefer SCRAM; BSI defaults to md5 and warns.
            - name: POSTGRESQL_PASSWORD_ENCRYPTION
              value: scram-sha-256
          volumeMounts:
            - name: postgres-data
              mountPath: /bitnami/postgresql
            # BSI image conf/tmp paths are not writable by UID 1001 without mounts.
            - name: postgresql-conf
              mountPath: /opt/bitnami/postgresql/conf
            - name: postgresql-tmp
              mountPath: /opt/bitnami/postgresql/tmp
            - name: tmp
              mountPath: /tmp
          readinessProbe:
            exec:
              command:
                - bash
                - -ec
                - pg_isready -U "$POSTGRESQL_USERNAME" -d "$POSTGRESQL_DATABASE" -h 127.0.0.1
            initialDelaySeconds: 15
            periodSeconds: 10
          livenessProbe:
            exec:
              command:
                - bash
                - -ec
                - pg_isready -U "$POSTGRESQL_USERNAME" -d "$POSTGRESQL_DATABASE" -h 127.0.0.1
            initialDelaySeconds: 30
            periodSeconds: 20
      volumes:
        - name: postgresql-conf
          emptyDir: {}
        - name: postgresql-tmp
          emptyDir: {}
        - name: tmp
          emptyDir: {}
  volumeClaimTemplates:
    - metadata:
        name: postgres-data
      spec:
        accessModes:
          - ReadWriteOnce
        resources:
          requests:
            storage: 10Gi